name: Deploy PCS Inventory

on:
  push:
    branches: ["main"]
    paths:
      - "MasterInventory.xlsx"
      - "photos/**"
      - "site/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PCS-INVENTORY
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build inventory from MasterInventory.xlsx
        run: python scripts/build_inventory.py

      # Copy the generated QR codes out of the temporary website build
      # and into the real qr-codes folder in the repository.
      - name: Update QR code folder
        run: |
          rm -rf qr-codes
          mkdir -p qr-codes
          cp -a _site/qr-codes/. qr-codes/

      # Save new/changed QR codes back to the main branch.
      - name: Commit QR codes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add qr-codes

          if git diff --cached --quiet; then
            echo "QR codes are already up to date."
          else
            git commit -m "Update generated QR codes"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
